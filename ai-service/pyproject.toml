[project]
name = "careeros-ai-service"
version = "0.1.0"
description = "CareerOS AI service: stateless, evidence-cited job requirement matching."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1",
    "fastapi>=0.120",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=5",
    "uvicorn>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.uv]
package = false
# Supply-chain precaution: only resolve package versions published at least two weeks
# before this date. Move it forward deliberately when upgrading dependencies.
exclude-newer = "2026-10-14T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test-only secrets
